# ---------------------------------------------------------------------
# trigger-ghcr-build
#
# On every tag push, fire a `repository_dispatch` at
# WXbet-org/docker-images on GitHub. That repo owns the Dockerfile
# and the release CI now; its `simplebuild4.yml` workflow clones this
# repo at the pushed SHA and builds + pushes
# ghcr.io/wxbet-org/simplebuild4:<tag> (plus :latest when the pushed
# tag is the highest sortable one here).
#
# Requires a GitLab CI variable (Settings → CI/CD → Variables):
#   GH_DISPATCH_TOKEN — fine-grained GitHub PAT with
#                       `Contents: Read and write` on
#                       WXbet-org/docker-images (or classic PAT with
#                       the `repo` scope).
# If the variable is flagged Protected, the pushed tag must also match
# a Protected Tag pattern — otherwise the variable is empty at job time.
#
# No Docker daemon or GHCR credentials are needed on the runner
# anymore — this job just POSTs JSON to api.github.com.
# ---------------------------------------------------------------------

variables:
  GH_DISPATCH_REPO: WXbet-org/docker-images

trigger-ghcr-build:
  stage: build
  tags: [build]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      set -eu
      : "${GH_DISPATCH_TOKEN:?GH_DISPATCH_TOKEN is not set (Settings → CI/CD → Variables)}"
      payload=$(printf '{"event_type":"simplebuild4-release","client_payload":{"tag":"%s","sha":"%s"}}' \
                 "$CI_COMMIT_TAG" "$CI_COMMIT_SHA")
      echo "Dispatching to github.com/${GH_DISPATCH_REPO}: tag=${CI_COMMIT_TAG} sha=${CI_COMMIT_SHA}"
      curl -sSf -X POST \
           -H "Authorization: Bearer ${GH_DISPATCH_TOKEN}" \
           -H "Accept: application/vnd.github+json" \
           "https://api.github.com/repos/${GH_DISPATCH_REPO}/dispatches" \
           -d "${payload}"
