<!DOCTYPE html>
<html>
  <head>
    <title>SimpleBuild4 - Web</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23015a9c'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='bold' fill='%23e0e0e0' text-anchor='middle'%3Es4%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ config.static.url }}css/xterm.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto%20Mono"
    />
    <!-- Reverse-proxy shim: textual-serve builds file-download URLs as
         `${window.location.origin}/download/${key}` -- absolute-origin,
         no path prefix. Behind a reverse proxy mounted under a URL
         prefix (X-Forwarded-Prefix), these URLs miss the prefix and
         404 at the origin root. Patch window.open to prepend our
         prefix to any /download/... URL that targets this origin. When
         `prefix` is empty (no proxy), this is a no-op. Loaded before
         textual.js so any early cache the library takes of window.open
         already sees the wrapped version. -->
    <script>
      (function () {
        var PREFIX = "{{ prefix }}";
        if (!PREFIX) return;
        var origOpen = window.open;
        window.open = function (url, target, features) {
          if (typeof url === "string") {
            try {
              var u = new URL(url, window.location.href);
              if (u.origin === window.location.origin
                  && u.pathname.indexOf("/download/") === 0
                  && u.pathname.indexOf(PREFIX + "/download/") !== 0) {
                u.pathname = PREFIX + u.pathname;
                url = u.toString();
              }
            } catch (e) { /* not a valid URL -- leave as-is */ }
          }
          return origOpen.call(this, url, target, features);
        };
      })();
    </script>
    <script src="{{ config.static.url }}js/textual.js"></script>
    <style>
      body {
        background: #0c181f;
        margin: 0;
        padding: 0;
      }

      body .textual-terminal {
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }

      body.-first-byte .textual-terminal {
        opacity: 1;
        transition: opacity 0.3s ease-out;
      }

      .dialog-container {
        position: absolute;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      body.-first-byte .intro-dialog {
        opacity: 0;
        display: none;
      }

      .shade {
        position: absolute;
        width: 100%;
        height: 100%;
        background: #0c181f;
      }

      .intro {
        z-index: 20;
        font-size: 16px;
        font-family: "Roboto Mono", menlo, monospace;
        color: rgba(255, 255, 255, 0.6);
      }

      .closed-dialog {
        opacity: 0;
        display: none;
      }

      body.-closed .closed-dialog {
        opacity: 1;
        display: flex;
      }

      .closed-dialog .intro {
        text-align: center;
      }

      .closed-dialog button {
        padding: 12px 24px;
        background-color: #5e0ba7;
        color: rgba(255, 255, 255, 0.95);
        border: none;
        font-family: "Roboto Mono", menlo, monospace;
        margin-top: 16px;
        cursor: pointer;
      }

      .closed-dialog button:hover {
        background: #ac5af4;
      }
    </style>
    <script>
      function getStartUrl() {
        const url = new URL(window.location.href);
        const params = new URLSearchParams(url.search);
        params.delete("delay");
        return url.pathname + "?" + params.toString();
      }
      async function refresh() {
        const ping_url = document.body.dataset.pingurl;
        if (ping_url) {
          await fetch(ping_url, { method: "GET", mode: "no-cors" });
        }
        window.location.href = getStartUrl();
      }
    </script>
  </head>
  <body data-pingurl="{{ ping_url }}">
    <div class="dialog-container intro-dialog">
      <div class="shade"></div>
      <div class="intro">Connecting...</div>
    </div>

    <div class="dialog-container closed-dialog">
      <div class="shade"></div>
      <div class="intro">
        <div>Session ended.</div>
        <button type="button" onClick="refresh()">Reconnect</button>
        {% if has_auth %}<button type="button" onClick="window.location.href='{{ prefix }}/logout'" style="background-color:#ba3c5b;margin-top:8px">Logout</button>{% endif %}
      </div>
    </div>

    <div
      id="terminal"
      class="textual-terminal"
      data-session-websocket-url="{{ app_websocket_url }}"
      data-font-size="{{ font_size }}"
    ></div>
  </body>
</html>
