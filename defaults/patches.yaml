# Patch download configuration for simplebuild4.
#
# This file is auto-seeded to data/patches.yaml on first run. Edit the
# copy in data/patches.yaml — the one in defaults/ is only the template
# and will not be touched again by the app.
#
# When you press the "Download" button on the Repository screen, every
# entry below is fetched via wget (or curl as fallback) into
# data/patches/ using `name` as the target filename. The file can then
# be picked on the Repository screen like any other patch and applied
# via "Patch".
#
# Entry format:
#   - name: <filename>.patch    # how the file is stored in data/patches/
#     url:  <https URL>         # direct download link
#
# Tip: you can also drop .patch files manually into data/patches/ —
# they'll show up on the Repository screen without needing an entry
# here. This file is only for patches you want to (re-)download from a
# URL on demand.

patches:
  # GX-API (C-SKY / Goceed Chinese STB boxes) — adds USE_GXAPI,
  # CARDREADER_GXAPI, bundles liboscam_gxapi.a (MCORE/C-SKY binary
  # inside the patch itself)
  - name: oscam-gxapi.patch
    url: https://simplebuild.dedyn.io/patches/gxapi/oscam-gxapi.patch

  # Android Wi-Interface STAPI wrapper, version 1 — for Android
  # STB targets with STAPI-style descrambler hardware. Adds a
  # WI_SMART compile switch that routes STAPI calls through the
  # WiSmart_* symbols exported by libwi.a (minimal, older).
  - name: oscam-stapi-libwi-v1.patch
    url: https://simplebuild.dedyn.io/patches/libwi/oscam-stapi-libwi-v1.patch

  # Android Wi-Interface STAPI wrapper, version 2 — adds USE_WI
  # flag, WebIF controls, wi.h header, Makefile auto-link. Pairs
  # with libwi.a (or libwi2.a as a superset with extra
  # Init/Destroy Status symbols).
  - name: oscam-stapi-libwi-v2.patch
    url: https://simplebuild.dedyn.io/patches/libwi/oscam-stapi-libwi-v2.patch

  # oscam-emu — adds key emulation for various CAS systems
  - name: oscam-emu.patch
    url: https://raw.githubusercontent.com/oscam-mirror/oscam-emu-patch/refs/heads/master/oscam-emu.patch
