name: cortexa7thf_openpli
description: "openpli cortexa7thf"
exclude_from_automation: true
builder: oe-sdk
arch: armv7
category: stb

# Result toolchain properties (auto-detected after build, pre-filled from PreBuild)
prefix: "arm-oe-linux-gnueabi-"
sysroot: "sysroots/cortexa7t2hf-vfp-oe-linux-gnueabi"
cflags: "-mthumb -mfpu=vfp -mfloat-abi=hard -mcpu=cortex-a7"
ldflags: "-Wl,--dynamic-linker=/lib/ld-linux-armhf.so.3"
machines: "hzero"

# OE-SDK builder config (next to this file)
config: cortexa7thf_openpli.config
