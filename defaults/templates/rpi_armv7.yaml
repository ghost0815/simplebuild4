name: rpi_armv7
description: Raspberry Pi 2 Model B
exclude_from_automation: true
builder: crosstool-ng
arch: armv7

# Result toolchain properties (used to register after successful build)
prefix: armv7-rpi2-linux-gnueabihf-
sysroot: armv7-rpi2-linux-gnueabihf/sysroot
cflags: ""
ldflags: ""
machines: ""

# Native crosstool-ng config (next to this file)
config: rpi_armv7.config

# Where the builder downloads its source tarballs.
# Comment out to use whatever the .config has set (CT_LOCAL_TARBALLS_DIR).
# Relative paths are resolved against the project root.
download_location: data/downloads
