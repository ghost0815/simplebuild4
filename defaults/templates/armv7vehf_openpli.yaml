name: armv7vehf_openpli
description: "openpli armv7vehf"
exclude_from_automation: true
builder: oe-sdk
arch: armv7
category: stb

# Result toolchain properties (auto-detected after build, pre-filled from PreBuild)
prefix: "arm-oe-linux-gnueabi-"
sysroot: "sysroots/armv7vehf-neon-vfpv4-oe-linux-gnueabi"
cflags: "-march=armv7ve -mfpu=neon-vfpv4 -mfloat-abi=hard"
ldflags: "-Wl,--dynamic-linker=/lib/ld-linux-armhf.so.3"
machines: "osmini4k osmio4k osmio4kplus"

# OE-SDK builder config (next to this file)
config: armv7vehf_openpli.config
