# Native build — compile oscam for the local system
name: native
description: Build for local system
sources:
  - name: default
    update_before_build: true
    patch_before_build: false
toolchains:
  - name: native

build:
  modules:
    - WEBIF
    - WEBIF_LIVELOG
    - WEBIF_JQUERY
    - TOUCH
    - HAVE_DVBAPI
    - WITH_LB
    - CS_CACHEEX
    - CW_CYCLE_CHECK
    - CLOCKFIX
    - IPV6SUPPORT
  protocols:
    - MODULE_CAMD35
    - MODULE_CAMD35_TCP
    - MODULE_CCCAM
    - MODULE_NEWCAMD
    - MODULE_RADEGAST
    - MODULE_SERIAL
  readers:
    - READER_NAGRA
    - READER_IRDETO
    - READER_CONAX
    - READER_CRYPTOWORKS
    - READER_SECA
    - READER_VIACCESS
    - READER_VIDEOGUARD
    - READER_DRE
    - READER_TONGFANG
    - READER_BULCRYPT
    - READER_GRIFFIN
    - READER_DGCRYPT
  card_readers:
    - CARDREADER_PHOENIX
    - CARDREADER_SMART
    - CARDREADER_PCSC
  use_libcrypto: true
  confdir: /usr/local/etc

upload: []
